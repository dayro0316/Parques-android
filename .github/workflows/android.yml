name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: parques-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar Release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk parques.apk
          gh release create "build-${{ github.run_number }}" parques.apk \
            --title "Versión ${{ github.run_number }}" \
            --notes "Compilación automática ${{ github.run_number }} (${{ github.sha }})" --latest
